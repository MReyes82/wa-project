<main class="setups-page page-shell">
    <header class="section-header">
        <div>
            <span class="badge">Mis setups</span>
            <h1>Tus registros</h1>
            <p id="my-setups-context">Registros guardados con tu cuenta.</p>
        </div>
        <div class="header-actions">
            <button id="btn-my-back-dashboard" class="btn-secondary">Volver</button>
            <button id="btn-create-setup" class="btn-primary">Crear setup</button>
        </div>
    </header>

    <section class="filters-panel surface-card">
        <div class="input-group">
            <label for="my-weather-filter">Clima</label>
            <select id="my-weather-filter">
                <option value="">Todos</option>
                <option value="dry">Seco</option>
                <option value="wet">Mojado</option>
            </select>
        </div>
        <div class="input-group">
            <label for="my-session-filter">Tipo de sesion</label>
            <select id="my-session-filter">
                <option value="">Todas</option>
                <option value="PRACTICE">Practica</option>
                <option value="QUALIFYING">Clasificacion</option>
                <option value="RACE">Carrera</option>
                <option value="TIME_TRIAL">Contrarreloj</option>
            </select>
        </div>
        <div class="input-group">
            <label for="my-controller-filter">Tipo de control</label>
            <select id="my-controller-filter">
                <option value="">Todos</option>
                <option value="GAMEPAD">Mando</option>
                <option value="WHEEL">Volante</option>
            </select>
        </div>
        <div class="input-group">
            <label for="my-team-filter">Equipo</label>
            <select id="my-team-filter">
                <option value="">Todos</option>
                <option value="1">Mercedes</option>
                <option value="2">Red Bull Racing</option>
                <option value="3">Ferrari</option>
                <option value="4">McLaren</option>
                <option value="5">Alpine</option>
                <option value="6">AlphaTauri</option>
                <option value="7">Aston Martin</option>
                <option value="8">Williams</option>
                <option value="9">Alfa Romeo</option>
                <option value="10">Haas</option>
                <option value="11">Sauber</option>
                <option value="12">VCARB</option>
                <option value="13">ApxGp</option>
                <option value="14">Konnersport</option>
                <option value="15">Cadillac</option>
                <option value="16">My team</option>
            </select>
        </div>
    </section>

    <section class="setups-list-panel">
        <div id="my-setups-status" class="empty-state">Cargando tus registros...</div>
        <div id="my-setups-list" class="setup-list"></div>
    </section>
</main>
