<main class="setups-page page-shell">
    <header class="section-header">
        <div>
            <span class="badge">Mis setups</span>
            <h1>Tus registros</h1>
            <p id="my-setups-context">Registros guardados con tu cuenta.</p>
        </div>
        <div class="header-actions">
            <button id="btn-my-back-dashboard" class="btn-secondary">Volver</button>
            <button id="btn-create-setup" class="btn-primary">Crear setup</button>
        </div>
    </header>

    <section class="filters-panel surface-card">
        <div class="input-group">
            <label for="my-weather-filter">Clima</label>
            <select id="my-weather-filter"></select>
        </div>
        <div class="input-group">
            <label for="my-session-filter">Tipo de sesion</label>
            <select id="my-session-filter"></select>
        </div>
        <div class="input-group">
            <label for="my-controller-filter">Tipo de control</label>
            <select id="my-controller-filter"></select>
        </div>
        <div class="input-group">
            <label for="my-team-filter">Equipo</label>
            <select id="my-team-filter"></select>
        </div>
    </section>

    <section class="setups-list-panel">
        <div id="my-setups-status" class="empty-state">Cargando tus registros...</div>
        <div id="my-setups-list" class="setup-list"></div>
    </section>
</main>
